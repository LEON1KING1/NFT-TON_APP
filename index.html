<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT TON App</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>

<body>

<div class="topbar">
  <button id="myNftsBtn">🖼 My NFTs</button>
  <button id="walletBtn">🔗 Connect Wallet</button>
</div>

<div id="nftPanel" class="nft-panel hidden">
  <h3>My NFTs</h3>
  <div id="nftList">Connect wallet to load NFTs</div>
</div>

<div class="card">
  <h1>Create an NFT</h1>
  <p class="subtitle">Create a single NFT or a collection.</p>

  <label>Name</label>
  <input type="text">

  <label>Image URL</label>
  <input type="text">

  <label>Description</label>
  <textarea></textarea>

  <label>Owner</label>
  <input id="owner" disabled>

  <button class="mint">Mint NFT</button>
</div>

<script src="script.js"></script>
</body>
</html>
