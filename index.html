<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NFT TON App</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <button id="openNfts">🖼 My NFTs</button>
  <div id="walletBtn"></div>
</div>

<!-- Portal‑style NFT Viewer -->
<div id="nftPortal" class="portal hidden">
  <div class="portalHeader">
    <h2>My NFTs</h2>
    <button id="closePortal">✕</button>
  </div>
  <div id="nftContainer" class="portalContent"></div>
</div>

<!-- Main Card -->
<div class="card">
  <h1>Create NFT</h1>

  <input id="nftName" placeholder="NFT name">
  <input id="nftImage" placeholder="Image URL">
  <textarea id="nftDesc" placeholder="Description"></textarea>

  <label>Owner</label>
  <input id="owner" disabled>

  <div class="btnRow">
    <button class="mint" id="mintBtn">Mint NFT</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
