<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Art Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <img src="assets/logo.png" alt="NFT Logo" class="logo">
        <h1>NFT Art Generator</h1>
        <p>Create unique NFT-style digital art in seconds</p>
    </header>

    <main>
        <input type="text" id="prompt" placeholder="Enter your NFT prompt here">
        <button id="generateBtn">Generate NFT</button>

        <div id="result"></div>
    </main>

    <footer>
        <p>Powered by Demo Images | Made for Telegram Web App</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
