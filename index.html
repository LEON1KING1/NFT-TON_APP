<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create NFT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <button id="myNftsBtn"> My NFTs</button>
  <button id="walletBtn"> Connect Wallet</button>
</div>

<!-- NFT Side Panel -->
<div id="nftPanel" class="nft-panel hidden">
  <h3>My NFTs</h3>
  <div id="nftList"></div>
</div>

<!-- Main Card -->
<div class="card">
  <h1>Create an NFT</h1>
  <p class="subtitle">
    Create a single NFT or a collection with multiple options.
  </p>

  <div class="toggle">
    <span>Onchain Metadata</span>
    <label class="switch">
      <input type="checkbox" checked>
      <span class="slider"></span>
    </label>
  </div>

  <label>Name *</label>
  <input type="text" placeholder="Name">

  <label>Image URL *</label>
  <input type="text" placeholder="https://example.com/nft.png">

  <label>Description</label>
  <textarea placeholder="Description"></textarea>

  <label>Owner *</label>
  <input id="owner" type="text" placeholder="Wallet address" disabled>

  <label>Royalty *</label>
  <div class="royalty">
    <input type="number" value="1">
    <span>%</span>
  </div>

  <label>Type</label>

  <div class="option active"> 
    <strong>Regular</strong>
    <p>Ordered collection. Only owner can mint.</p>
  </div>

  <div class="option">
    <strong>Signature Mint</strong>
    <p>Anyone can mint with a valid signature.</p>
  </div>

  <div class="option">
    <strong>Merkle Mint</strong>
    <p>Mint with a Merkle proof.</p>
  </div>

  <button class="mint">Mint NFT</button>
</div>

<script src="script.js"></script>
</body>
</html>
