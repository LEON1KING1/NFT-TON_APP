<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT TON App</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">
  <button id="myNftsBtn">🖼 My NFTs</button>
  <div id="walletBtn"></div>
</div>

<!-- FULL SCREEN NFT PAGE -->
<div id="nftPage" class="nft-page hidden">
  <div class="nft-header">
    <button id="closeNfts">← Back</button>
    <h2>My NFTs</h2>
  </div>
  <div id="nftList" class="nft-grid"></div>
</div>

<!-- MAIN CARD -->
<div class="card">
  <h1>Create NFT</h1>

  <label>Name *</label>
  <input id="nftName" placeholder="NFT name">

  <label>Image URL *</label>
  <input id="nftImage" placeholder="https://...">

  <label>Description</label>
  <textarea id="nftDesc"></textarea>

  <label>Owner</label>
  <input id="owner" disabled>

  <button class="mint" id="mintBtn">Mint NFT</button>
</div>

<script src="script.js"></script>
</body>
</html>
